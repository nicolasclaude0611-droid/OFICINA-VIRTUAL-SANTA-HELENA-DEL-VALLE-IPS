<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Post Día del Psicólogo</title><style>
/* Letra oficial: Eras Bold ITC / Eras Demi ITC (instaladas en el equipo; no se guardan en el repositorio) */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#888;padding:30px}
#post{width:1080px;height:1350px;position:relative;overflow:hidden;background:#fff;font-family:"Eras Demi ITC",sans-serif;color:#0A2233}
.onda{position:absolute;left:-200px;right:-200px;bottom:-520px;height:1000px;border-radius:50%;background:linear-gradient(135deg,#004BAD 0%,#1894D1 60%,#4CAFDC 100%)}
.psi{position:absolute;right:70px;top:70px;width:300px;height:300px;border-radius:50%;background:#EAF5FC;display:flex;align-items:center;justify-content:center;
 font-family:"Eras Bold ITC","DejaVu Sans",sans-serif;font-size:250px;line-height:1;color:#1894D1}
.psi span{display:block;margin-top:-10px}
.cont{position:absolute;left:72px;top:110px;width:600px}
.tag{display:inline-block;background:#FFF212;color:#0A2233;font-family:"Eras Bold ITC";font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:12px 24px;border-radius:999px}
h1{margin-top:26px;font-family:"Eras Bold ITC";font-weight:400;font-size:104px;line-height:.98;letter-spacing:-.01em}
h1 span{color:#1894D1}
.raya{width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,#FFF212,#FFCC29);margin-top:30px}
.msg{margin-top:30px;width:560px;font-size:40px;line-height:1.32}
.hel{position:absolute;right:0px;bottom:70px;width:620px;height:620px;object-fit:contain}
.globo{position:absolute;left:110px;top:930px;width:400px;background:#fff;color:#1894D1;border-radius:30px;padding:26px 30px;font-family:"Eras Bold ITC";font-size:38px;line-height:1.15;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.globo::after{content:"";position:absolute;right:-24px;top:58px;border:16px solid transparent;border-left:26px solid #fff;border-right:0}
.firma{position:absolute;left:0;right:0;bottom:0;height:150px;background:#fff;display:flex;align-items:center;justify-content:center;gap:26px}
.firma img{height:96px}
.firma p{font-family:"Eras Medium ITC";font-size:30px;color:#1894D1}
.firma .sep{width:2px;height:70px;background:#D5E6F0}
</style></head><body>
<section id="post">
  <div class="onda"></div>
  <div class="psi"><span>Ψ</span></div>
  <div class="cont">
    <span class="tag">20 de noviembre</span>
    <h1>Feliz Día del <span>Psicólogo</span></h1>
    <div class="raya"></div>
  </div>
  <p class="msg" style="position:absolute;left:72px;top:545px">Gracias por escuchar sin juzgar, acompañar en los momentos difíciles y recordarnos que cuidar la mente también es salud.</p>
  <img class="hel" src="img/helenita-corazon.png">
  <div class="globo">¡Gracias por cuidar de todos!</div>
  <div class="firma"><img src="img/logo-completo-transparente.png"><div class="sep"></div><p>¡La Salud, nuestro compromiso!</p></div>
</section></body></html>
