<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Historia vacunas particulares</title>
<!-- Plantilla: historia.html?v=A&p=1  (v = A, B1, B2, B3 · p = 1, 2, 3). Textos en textos.js.
     Helenita: pantalla 1 «invitar» (mano abierta), pantalla 2 sin Helenita, pantalla 3 «corazón». Imágenes PNG: crear-imagenes.sh. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#888}
#h{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Eras Demi ITC",sans-serif;color:#fff;
   background:linear-gradient(160deg,#004BAD 0%,#1A6DBD 35%,#1894D1 70%,#4CAFDC 100%)}
.logo{position:absolute;left:64px;top:262px;width:330px}
.tag{display:inline-block;background:#FFF212;color:#0A2233;font-family:"Eras Bold ITC";font-size:30px;letter-spacing:.05em;text-transform:uppercase;padding:14px 30px;border-radius:999px}
.arriba{position:absolute;left:64px;right:64px;top:480px}
h1{margin-top:26px;font-family:"Eras Bold ITC";font-weight:400;font-size:92px;line-height:1.02}
h1 em{font-style:normal;color:#FFF212}
.card{background:#fff;color:#0A2233;border-radius:30px;padding:30px 36px;margin-top:26px}
.lista{display:flex;flex-direction:column;gap:22px;font-size:46px;padding:40px 44px}
.lista div{display:flex;gap:14px;align-items:flex-start;line-height:1.15}
.lista div::before,.puntos div::before{content:"";flex:none;width:18px;height:18px;margin-top:10px;border-radius:50%;background:#1894D1;box-shadow:0 0 0 6px rgba(24,148,209,.2)}
.lista .ancho{grid-column:1 / span 2}
.puntos{display:flex;flex-direction:column;gap:16px;font-size:38px}
.puntos div{display:flex;gap:16px;align-items:flex-start;line-height:1.2}
.texto{font-size:46px;line-height:1.3}
.grande{font-family:"Eras Bold ITC";font-size:62px;line-height:1.22;padding:50px 48px;margin-top:40px}
.der{position:absolute;left:500px;right:56px}
.apoyo{font-size:42px;line-height:1.3}
.llamado{font-size:36px;line-height:1.3}
.pill{display:flex;flex-direction:column;align-items:center;background:#FFF212;color:#0A2233;border-radius:999px;padding:18px 20px;font-family:"Eras Bold ITC";line-height:1}
.pill small{font-size:28px;display:flex;align-items:center;gap:10px}
.pill b{font-weight:400;font-size:46px;margin-top:6px;white-space:nowrap}
.sinorden{font-family:"Eras Bold ITC";font-size:28px;white-space:nowrap;color:#FFF212;text-align:center}
.sede{font-size:30px;line-height:1.3;text-align:center;color:#EAF5FC}
.col{display:flex;flex-direction:column;align-items:center;text-align:center;gap:34px}
.col .pill{padding:20px 40px}
.badge{position:absolute;left:720px;top:1360px;width:280px;height:280px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.hel{position:absolute;left:-190px;top:900px;width:900px;height:900px}
.banda{position:absolute;left:0;right:0;bottom:0;height:220px;background:#fff;display:flex;justify-content:center;padding-top:34px}
.banda p{font-family:"Eras Medium ITC";font-size:36px;color:#1894D1}
.amarilla{position:absolute;left:0;right:0;bottom:220px;height:10px;background:linear-gradient(90deg,#FFF212,#FFCC29)}
</style></head><body>
<section id="h"></section>
<script src="textos.js"></script>
<script>
const q=new URLSearchParams(location.search), v=VARIACIONES[q.get('v')||'A'], p=+(q.get('p')||1), C=COMUN, h=document.getElementById('h');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const WA=`<svg width="30" height="30" viewBox="0 0 32 32"><path fill="#0A2233" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.7s1.2 3.2 1.3 3.4c.2.2 2.3 3.5 5.6 4.9 2.1.9 2.9 1 4 .8.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>`;
// jeringa + escudo (sencillo)
const ICONO=`<svg width="190" height="190" viewBox="0 0 100 100"><path d="M50 8 L84 20 V48 C84 70 68 84 50 92 C32 84 16 70 16 48 V20 Z" fill="#EAF5FC" stroke="#1894D1" stroke-width="5" stroke-linejoin="round"/>
<g transform="rotate(45 50 52)" stroke="#1894D1" stroke-width="5" stroke-linecap="round" fill="none"><rect x="43" y="34" width="14" height="30" rx="3" fill="#fff"/><path d="M50 64v12M44 34h12M50 34v-8M45 26h10"/><path d="M43 44h6M43 52h6" stroke-width="3"/></g>
<circle cx="72" cy="74" r="12" fill="#FFF212"/><path d="M66 74l4 4 8-8" stroke="#0A2233" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let html=`<img class="logo" src="img/logo-con-lema-transparente.png">`;
const POSE={1:'invitar',3:'corazon'};   // pantalla 2 va sin Helenita
if(p===1){
  const t=v.p1.titulo.replace(/^¡?Vacúnese/,m=>`<em>${m}</em>`);
  html+=`<div class="arriba"><span class="tag">${esc(v.p1.etiqueta)}</span><h1>${t}</h1></div>`;
  if(v.p1.apoyo) html+=`<p class="der apoyo" style="top:1000px">${esc(v.p1.apoyo)}</p>`;
  html+=`<div class="badge">${ICONO}</div>`;
}
if(p===2){
  html+=`<div class="arriba"><span class="tag">${esc(v.p2.etiqueta)}</span>`;
  if(v.p2.lista) html+=`<div class="card lista">${v.p2.lista.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  else html+=`<div class="card texto grande">${esc(v.p2.texto)}</div><div class="badge" style="position:relative;left:auto;top:auto;margin:90px auto 0;width:340px;height:340px">${ICONO.replace(/190/g,'230')}</div>`;
  html+=`</div>`;
}
if(p===3){
  html+=`<div class="arriba"><span class="tag">${esc(v.p3.etiqueta)}</span>`;
  if(v.p3.puntos.length) html+=`<div class="card puntos">${v.p3.puntos.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  html+=`</div>`;
  // columna derecha centrada: llamado, botón y sede
  if(v.p3.puntos.length){
    html+=`<div class="der col" style="top:1060px"><p class="llamado">${esc(v.p3.llamado)}</p>
           <div class="pill"><small>${WA} WhatsApp</small><b>${esc(C.whatsapp)}</b></div>
           <p class="sede">${esc(C.sede)}</p></div>`;
  } else { // variaciones B: llamado grande en tarjeta arriba
    html=html.replace(/<\/div>$/,'');
    html+=`<div class="card texto grande">${esc(v.p3.llamado)}</div></div>
           <div class="der col" style="top:1180px"><div class="pill"><small>${WA} WhatsApp</small><b>${esc(C.whatsapp)}</b></div>
           <p class="sede">${esc(C.sede)}</p></div>`;
  }
}
if(POSE[p]) html+=`<img class="hel" src="img/helenita-${POSE[p]}.png">`;
html+=`<div class="amarilla"></div><div class="banda"><p>${esc(C.eslogan)}</p></div>`;
h.innerHTML=html;
</script></body></html>
