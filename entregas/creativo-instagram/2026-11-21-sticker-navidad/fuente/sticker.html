<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Sticker Navidad</title><style>
@font-face{font-family:"Lobster";src:url(img/lobster.woff2) format("woff2")}
@page{size:13.6cm 13.6cm;margin:0}
*{margin:0;padding:0;box-sizing:border-box} html,body{background:#fff}
#s{width:1606px;height:1606px;position:relative;overflow:hidden;background:linear-gradient(180deg,#004BAD 0%,#1A6DBD 30%,#1894D1 55%);font-family:"Eras Demi ITC",sans-serif}
.escena{position:absolute;left:0;bottom:0;width:1606px;height:896px;background-size:cover;background-position:center bottom;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 300px);mask-image:linear-gradient(180deg,transparent 0,#000 300px)}
.fundido{position:absolute;left:0;right:0;top:700px;height:260px;background:linear-gradient(180deg,#1894D1 0%,rgba(24,148,209,.0) 100%)}
.logo{position:absolute;left:50%;top:110px;width:420px;transform:translateX(-50%)}
h1{position:absolute;left:0;right:0;top:375px;text-align:center;font-family:"Lobster";font-weight:400;font-size:160px;line-height:1;color:#FFF212;text-shadow:0 6px 0 #C8382D,0 14px 26px rgba(0,0,0,.3)}
.msg{position:absolute;left:140px;right:140px;top:575px;text-align:center;color:#fff;font-size:47px;line-height:1.3;text-shadow:0 2px 10px rgba(0,40,110,.55)}
.copo{position:absolute;color:#fff;opacity:.8;font-size:44px}
.corte{position:absolute;left:35px;top:35px;width:1536px;height:1536px;border:3px dashed #ff00a8;display:none}
body.conCorte .corte{display:block}
</style></head><body><section id="s">
<div class="escena" id="escena"></div>
<span class="copo" style="left:80px;top:120px">❄</span><span class="copo" style="right:90px;top:150px;font-size:56px">❄</span><span class="copo" style="left:150px;top:420px;font-size:34px">❄</span><span class="copo" style="right:150px;top:440px;font-size:38px">❄</span>
<img class="logo" src="img/logo-con-lema-transparente.png">
<h1>¡Feliz Navidad!</h1>
<p class="msg">Santa Helena del Valle IPS les desea que la magia de la Navidad ilumine cada rincón de su hogar y llene su corazón de gratitud, alegría y esperanza.</p>
<div class="corte"></div>
</section>
<script>const o=new URLSearchParams(location.search).get('op')||'2';document.getElementById('escena').style.backgroundImage=`url(img/escena-ia-${o}.png)`;</script>
</body></html>
