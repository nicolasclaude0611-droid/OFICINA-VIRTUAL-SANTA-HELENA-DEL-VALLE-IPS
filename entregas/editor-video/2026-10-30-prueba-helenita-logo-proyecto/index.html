<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("assets/fonts/bricolage.woff2") format("woff2");
        font-weight: 200 800;
      }
      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree.woff2") format("woff2");
        font-weight: 300 900;
      }
      :root {
        --navy: #0a2233;
        --navy2: #0f2f47;
        --azul: #0596c8;
        --azul-prof: #06709a;
        --sol: #ffe81a;
        --neblina: #eff4f7;
        --fondo: #fbfcfd;
        --texto2: #4a6171;
        --font-display: "Bricolage Grotesque", sans-serif;
        --font-body: "Figtree", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: var(--navy);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      /* Fondos */
      .ground { position: absolute; inset: 0; }
      #bg-azul { background: radial-gradient(120% 70% at 50% 85%, var(--azul) 0%, var(--azul-prof) 55%, var(--navy2) 100%); }
      #bg-claro { background: radial-gradient(110% 70% at 50% 28%, #ffffff 0%, var(--neblina) 70%, #dfeaf1 100%); opacity: 0; }
      #bg-navy { background: radial-gradient(120% 80% at 50% 25%, var(--navy2) 0%, var(--navy) 70%); }

      .sol-agua {
        position: absolute; width: 1500px; height: 1865px; left: -210px; top: -120px;
        background: url("assets/img/sol.png") center / contain no-repeat;
      }
      #sol-a { opacity: 0.16; }
      #sol-c { opacity: 0.10; left: 230px; top: -520px; }

      .escena { position: absolute; inset: 0; }
      #escena-b, #escena-c { opacity: 0; }

      /* Helenita */
      .h-wrap { position: absolute; }
      .h-wrap video { width: 100%; height: 100%; display: block; }
      #ha-wrap { width: 1240px; height: 1240px; left: -80px; top: 700px; }
      #hb-wrap { width: 1080px; height: 1080px; left: -330px; top: 1010px; }
      #hc-wrap { width: 1100px; height: 1100px; left: -10px; top: 880px; }

      /* Escena A */
      #a-titulo {
        position: absolute; left: 0; right: 0; top: 300px; text-align: center;
        font-family: var(--font-display); font-weight: 800; color: #fff;
        font-size: 168px; line-height: 0.95; letter-spacing: -0.045em;
      }
      #a-titulo .amarillo { color: var(--sol); }
      #a-sub {
        position: absolute; left: 0; right: 0; top: 520px; text-align: center;
        font-family: var(--font-body); font-weight: 700; color: #fff; font-size: 64px; letter-spacing: -0.01em;
      }
      .w { display: inline-block; }

      /* Escena B */
      #b-kicker {
        position: absolute; left: 0; right: 0; top: 250px; text-align: center;
        font-family: var(--font-body); font-weight: 700; font-size: 50px; color: var(--texto2);
      }
      #b-logo-box { position: absolute; left: 90px; top: 380px; width: 900px; height: 510px; }
      #b-logo { position: absolute; inset: 0; background: url("assets/img/logo.png") center / contain no-repeat; }
      #b-brillo {
        position: absolute; inset: 0;
        -webkit-mask: url("assets/img/logo.png") center / contain no-repeat;
        mask: url("assets/img/logo.png") center / contain no-repeat;
        background: linear-gradient(115deg, transparent 0%,
          transparent calc(var(--shimmer-pos, -30%) - 12%),
          rgba(255, 255, 255, 0.9) var(--shimmer-pos, -30%),
          transparent calc(var(--shimmer-pos, -30%) + 12%), transparent 100%);
      }
      #b-sol {
        position: absolute; width: 520px; height: 646px; left: 280px; top: 360px;
        background: var(--sol);
        -webkit-mask: url("assets/img/sol-solido.png") center / contain no-repeat;
        mask: url("assets/img/sol-solido.png") center / contain no-repeat;
      }
      .anillo {
        position: absolute; left: 540px; top: 635px; width: 520px; height: 520px;
        margin: -260px 0 0 -260px; border-radius: 50%; border: 14px solid var(--azul); opacity: 0;
      }
      #b-anillo2 { border-color: var(--sol); }
      #b-lema {
        position: absolute; left: 0; right: 0; top: 930px; text-align: center;
        font-family: var(--font-display); font-weight: 700; font-size: 74px;
        letter-spacing: -0.03em; color: var(--navy);
      }

      /* Iris hacia escena C */
      #escena-c { clip-path: circle(0% at 540px 635px); }

      /* Escena C */
      #c-logo {
        position: absolute; left: 150px; top: 200px; width: 780px; height: 442px;
        background: url("assets/img/logo-lema.png") center / contain no-repeat;
      }
      #c-frase {
        position: absolute; left: 70px; right: 70px; top: 690px; text-align: center;
        font-family: var(--font-body); font-weight: 700; font-size: 54px; line-height: 1.18; color: #fff;
      }
      #c-frase b { color: var(--sol); font-family: var(--font-display); font-weight: 800; }
      #c-cta {
        position: absolute; left: 90px; width: 900px; top: 870px; height: 132px;
        border-radius: 999px; background: var(--sol); color: var(--navy);
        display: flex; align-items: center; justify-content: center; gap: 22px;
        font-family: var(--font-body); font-weight: 800; font-size: 48px; letter-spacing: -0.01em;
      }
      #c-cta small { font-weight: 600; font-size: 38px; }
      .confeti {
        position: absolute; left: 540px; top: 1260px; width: 22px; height: 36px;
        border-radius: 5px; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <!-- Fondo escena A (azul) -->
      <div id="escena-a" class="escena" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="bg-azul" class="ground"></div>
        <div id="sol-a" class="sol-agua" data-layout-ignore></div>
        <div id="ha-wrap" class="h-wrap">
          <video id="h-saludar" class="clip" src="assets/video/saludar.webm" muted playsinline
            data-start="0" data-duration="3.35" data-track-index="1"></video>
        </div>
        <h1 id="a-titulo"><span class="w">¡Hola!</span></h1>
        <div id="a-sub"><span class="w">Soy</span> <span class="w" style="color: var(--sol)">Helenita</span></div>
      </div>

      <!-- Escena B (clara): presentación del logo -->
      <div id="escena-b" class="escena" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="bg-claro" class="ground"></div>
        <div id="b-cont">
          <div id="b-kicker"><span class="w">Le</span> <span class="w">presento</span> <span class="w">a…</span></div>
          <div id="b-anillo1" class="anillo"></div>
          <div id="b-anillo2" class="anillo"></div>
          <div id="b-logo-box">
            <div id="b-logo"></div>
            <div id="b-brillo"></div>
          </div>
          <div id="b-sol" data-layout-ignore></div>
          <div id="b-lema"><span class="w">¡La</span> <span class="w">salud,</span> <span class="w">nuestro</span> <span class="w">compromiso!</span></div>
          <div id="hb-wrap" class="h-wrap">
            <video id="h-senalar" class="clip" src="assets/video/senalar.webm" muted playsinline
              data-start="3.2" data-duration="3.6" data-track-index="2"></video>
          </div>
        </div>
      </div>

      <!-- Escena C (navy): cierre con llamado a la acción -->
      <div id="escena-c" class="escena" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="bg-navy" class="ground"></div>
        <div id="sol-c" class="sol-agua" data-layout-ignore></div>
        <div id="confetis" data-layout-ignore></div>
        <div id="hc-wrap" class="h-wrap">
          <video id="h-pulgar" class="clip" src="assets/video/pulgar.webm" muted playsinline
            data-start="6.4" data-duration="3.6" data-track-index="3"></video>
        </div>
        <div id="c-logo"></div>
        <div id="c-frase">
          <b>20 años</b> al servicio de las familias<br />del Cesar y La Guajira
        </div>
        <div id="c-cta"><span>Agende su cita</span><small>WhatsApp 311 339 8988</small></div>
      </div>

      <!-- Música (generada localmente, libre de derechos) y efectos (Pixabay) -->
      <audio id="musica" class="clip" src="assets/bgm/musica.wav" data-start="0" data-duration="10"
        data-track-index="10" data-volume="0.55" data-fade-in="0.2" data-fade-out="1.2"></audio>
      <audio id="sfx-pop" class="clip" src="assets/sfx/pop.mp3" data-start="0.25" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-whoosh1" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.0" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="3.55" data-media-start="3.65" data-duration="0.85" data-track-index="13" data-volume="0.35" data-fade-out="0.2"></audio>
      <audio id="sfx-impacto" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="4.4" data-track-index="14" data-volume="0.45"></audio>
      <audio id="sfx-brillo" class="clip" src="assets/sfx/sparkle.mp3" data-start="4.9" data-track-index="15" data-volume="0.5"></audio>
      <audio id="sfx-whoosh2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="6.3" data-track-index="16" data-volume="0.55"></audio>
      <audio id="sfx-chime" class="clip" src="assets/sfx/chime.mp3" data-start="7.55" data-track-index="17" data-volume="0.45"></audio>
    </div>

    <script>
      // Confeti con semilla fija (adaptado del componente "confetti" del catálogo)
      (function () {
        var cont = document.getElementById("confetis");
        var colores = ["#FFE81A", "#0596C8", "#FFFFFF", "#FFE81A", "#06709A", "#E9739B"];
        for (var i = 0; i < 34; i++) {
          var p = document.createElement("span");
          p.className = "confeti";
          p.id = "cf-" + i;
          p.style.background = colores[i % colores.length];
          cont.appendChild(p);
        }
      })();

      const tl = gsap.timeline({ paused: true });
      const EXPO = "expo.out";

      // Estado inicial de escenas

      // ---------- Escena A: saludo (0 – 3.3 s) ----------
      tl.to("#sol-a", { rotation: 14, duration: 3.4, ease: "none" }, 0);
      tl.fromTo("#ha-wrap", { y: 70, scale: 0.96 }, { y: 0, scale: 1, duration: 0.9, ease: "back.out(1.4)" }, 0);
      tl.fromTo("#a-titulo .w", { opacity: 1, scale: 1.18, filter: "blur(0px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: EXPO }, 0);
      tl.fromTo("#a-sub .w", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.09, ease: "power4.out" }, 0.55);

      // Transición 1: barrido (whip) + cambio de color de fondo
      tl.to(["#a-titulo", "#a-sub"], { x: -1200, filter: "blur(18px)", duration: 0.3, ease: "power3.in" }, 3.0);
      tl.to("#ha-wrap", { x: -1300, filter: "blur(16px)", duration: 0.32, ease: "power3.in" }, 3.02);
      tl.set("#escena-b", { opacity: 1 }, 3.2);
      tl.fromTo("#bg-claro", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 3.05);
      tl.set("#escena-a", { opacity: 0 }, 3.4);

      // ---------- Escena B: presentación del logo (3.2 – 6.6 s) ----------
      tl.fromTo("#hb-wrap", { x: -500, filter: "blur(14px)" }, { x: 0, filter: "blur(0px)", duration: 0.55, ease: EXPO }, 3.2);
      tl.fromTo("#b-kicker .w", { opacity: 0, color: "#b9c7d0" },
        { opacity: 1, color: "#4A6171", duration: 0.2, stagger: 0.09, ease: "power2.out" }, 3.4);
      // El sol entra girando y "se convierte" en el logo
      tl.fromTo("#b-sol", { scale: 0, rotation: -220, opacity: 1 },
        { scale: 0.9, rotation: 0, duration: 0.75, ease: "back.out(1.6)" }, 3.55);
      tl.to("#b-sol", { scale: 0.4, opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power3.in" }, 4.3);
      // Golpe de logo (adaptado de "logo-sting")
      tl.fromTo("#b-logo-box", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: EXPO }, 4.4);
      tl.fromTo("#b-anillo1", { scale: 0.4, opacity: 0.95 }, { scale: 2.6, opacity: 0, duration: 0.7, ease: "power3.out" }, 4.45);
      tl.fromTo("#b-anillo2", { scale: 0.3, opacity: 0.9 }, { scale: 2.1, opacity: 0, duration: 0.6, ease: "power3.out" }, 4.52);
      // Brillo sobre el logo (adaptado de "shimmer-sweep")
      tl.fromTo("#b-brillo", { "--shimmer-pos": "-30%" }, { "--shimmer-pos": "130%", duration: 0.9, ease: "power2.inOut" }, 4.95);
      // Lema palabra por palabra
      tl.fromTo("#b-lema .w", { opacity: 0, y: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.1, ease: "power4.out" }, 5.0);

      // Transición 2: iris desde el centro del logo
      tl.to("#b-cont", { scale: 1.08, duration: 0.45, ease: "power2.in" }, 6.25);
      tl.set("#escena-c", { opacity: 1 }, 6.35);
      tl.fromTo("#escena-c", { clipPath: "circle(0% at 540px 635px)" },
        { clipPath: "circle(150% at 540px 635px)", duration: 0.5, ease: "power3.in" }, 6.35);
      tl.set("#escena-b", { opacity: 0 }, 6.9);

      // ---------- Escena C: cierre (6.4 – 10 s) ----------
      tl.to("#sol-c", { rotation: -10, duration: 3.6, ease: "none" }, 6.4);
      tl.fromTo("#hc-wrap", { y: 260, scale: 0.9 }, { y: 0, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 6.5);
      tl.fromTo("#c-logo", { opacity: 0, scale: 0.85, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: EXPO }, 6.65);
      tl.fromTo("#c-frase", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 7.05);
      tl.fromTo("#c-cta", { scaleX: 0.2, scaleY: 0.6, opacity: 0 },
        { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.55, ease: "elastic.out(1, 0.6)" }, 7.5);
      // Confeti (determinista)
      for (var i = 0; i < 34; i++) {
        var ang = -Math.PI / 2 + Math.sin(i * 1.7) * 1.25;
        var dist = 420 + ((i * 97) % 380);
        var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
        tl.fromTo("#cf-" + i, { x: 0, y: 0, rotation: 0, opacity: 1, scale: 0.6 },
          { x: dx, y: dy, rotation: 200 + i * 41, scale: 1, duration: 0.8, ease: "power3.out" }, 7.55 + (i % 6) * 0.015);
        tl.to("#cf-" + i, { y: dy + 520, rotation: "+=" + (160 + i * 13), opacity: 0, duration: 1.05, ease: "power1.in" }, 8.35 + (i % 6) * 0.015);
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
