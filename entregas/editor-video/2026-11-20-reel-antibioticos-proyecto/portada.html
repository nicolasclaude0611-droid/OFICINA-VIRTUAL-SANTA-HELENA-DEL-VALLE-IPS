<!doctype html><html><head><meta charset="utf-8"><style>@font-face { font-family: "Eras Bold"; src: url("assets/fonts/ERASBD.TTF") format("truetype"); }
@font-face { font-family: "Eras Demi"; src: url("assets/fonts/ERASDEMI.TTF") format("truetype"); }
@font-face { font-family: "Eras Medium"; src: url("assets/fonts/ERASMD.TTF") format("truetype"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A2233; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Eras Demi", sans-serif; color: #fff; }
#fondo { position: absolute; inset: 0; background: linear-gradient(180deg, #1894D1 0%, #0F5E92 38%, #0B3556 72%, #0A2233 100%); }
#flor { position: absolute; left: 560px; top: 1150px; width: 820px; opacity: 0.06; }
#puntos { position: absolute; inset: 0; opacity: 0.18;
  background-image: radial-gradient(circle, rgba(255,255,255,0.9) 1.5px, transparent 2px); background-size: 72px 72px; }

/* subtítulos arriba, palabra por palabra */
.sub { position: absolute; left: 70px; top: 190px; width: 940px; height: 240px; display: flex; flex-wrap: wrap;
  align-content: center; justify-content: center; gap: 4px 0; opacity: 0;
  font-family: "Eras Bold", sans-serif; font-size: 66px; line-height: 1.12; text-align: center;
  text-shadow: 0 4px 14px rgba(10,34,51,0.55); }
.sub .w { display: inline-block; margin: 0 9px; opacity: 0; }
.sub .k { display: inline-block; font-weight: normal; background: #FFF212; color: #0A2233; padding: 2px 14px 6px; border-radius: 14px; text-shadow: none; margin: 0 2px; }

/* insignia fija de la semana */
#insignia { position: absolute; left: 0; top: 455px; width: 1080px; opacity: 0; display: flex; justify-content: center; }
.ins-pill { white-space: nowrap;
  display: flex; align-items: center; gap: 12px; padding: 10px 26px 10px 14px; border-radius: 40px;
  background: rgba(10,34,51,0.55); border: 3px solid #FFF212; font-family: "Eras Bold", sans-serif; font-size: 27px; letter-spacing: 0.02em; }
.ins-mini { width: 34px; height: 41px; display: block; }
.ins-mini svg { width: 100%; height: 100%; }

/* escenas */
.esc { position: absolute; inset: 0; opacity: 0; }
.obj { position: absolute; opacity: 0; }
.obj svg, .fija svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bac, .vir, .cap { transform: rotate(var(--r, 0deg)); filter: drop-shadow(0 0 12px rgba(255,255,255,0.45)); }
.bac.fija { position: absolute; left: 0; top: 0; opacity: 1; }
.fija { position: absolute; }
.esc-g { position: absolute; filter: drop-shadow(0 0 8px rgba(255,255,255,0.6)); }
.equis, .visto { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
.tag { font-family: "Eras Bold", sans-serif; font-size: 34px; letter-spacing: 0.04em; padding: 8px 20px; border-radius: 14px;
  border: 3px solid; background: rgba(10,34,51,0.62); white-space: nowrap; }
.tag.grande { font-size: 42px; padding: 10px 24px; }
.nota { background: #fff; color: #0A2233; border-radius: 30px; padding: 22px 26px; font-size: 36px; line-height: 1.2;
  box-shadow: 0 10px 30px rgba(10,34,51,0.35); }
.nota b { font-family: "Eras Bold", sans-serif; color: #1894D1; font-weight: normal; }

.vs { font-family: "Eras Bold", sans-serif; font-size: 80px; color: #FFF212; }

#ins-g { display: flex; align-items: center; gap: 34px; padding: 34px 40px; border-radius: 40px; background: rgba(10,34,51,0.5);

#cuerpo, #med, #esc11, #fam11 { filter: drop-shadow(0 0 14px rgba(255,255,255,0.45)); }

.cal { }

.dia { width: 124px; height: 150px; border: 4px solid #fff; border-radius: 20px; background: rgba(10,34,51,0.5);

.dia small { font-family: "Eras Bold", sans-serif; font-size: 24px; }

.caja { border: 4px solid #fff; border-radius: 30px; background: rgba(10,34,51,0.55); padding-top: 30px; text-align: center; }

.www { left: 0; top: 1048px; width: 1080px; text-align: center; font-family: "Eras Bold", sans-serif; font-size: 40px; color: #fff; }
